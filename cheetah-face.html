<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">A detailed 3D cheetah face whose head and eyes follow your cursor.</h2>
<div id="cheetah-wrap" style="width:100%;display:flex;justify-content:center;padding:0.5rem 0;">
<canvas id="cheetah-canvas" style="width:100%;max-width:560px;height:380px;display:block;"></canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var canvas=document.getElementById('cheetah-canvas');
var wrap=document.getElementById('cheetah-wrap');
var width=wrap.clientWidth>560?560:wrap.clientWidth;
var height=380;

function rand(a,b){return a+Math.random()*(b-a);}

function makeCoatTexture(isMuzzle){
var c=document.createElement('canvas');
c.width=1024;c.height=1024;
var ctx=c.getContext('2d');
var g=ctx.createRadialGradient(512,380,80,512,512,700);
if(isMuzzle){g.addColorStop(0,'#FBF3E1');g.addColorStop(1,'#EAD8B4');}
else{g.addColorStop(0,'#E3B064');g.addColorStop(0.55,'#CE9743');g.addColorStop(1,'#A9782E');}
ctx.fillStyle=g;ctx.fillRect(0,0,1024,1024);
for(var n=0;n<9000;n++){
var x=rand(0,1024),y=rand(0,1024);
var v=rand(-14,14);
ctx.fillStyle='rgba('+(v>0?'255,240,210,':'70,45,20,')+(Math.abs(v)/40)+')';
ctx.fillRect(x,y,1.4,1.4);
}
var count=isMuzzle?70:420;
for(var i=0;i<count;i++){
var sx=rand(0,1024),sy=rand(0,1024);
if(isMuzzle&&sy>650) continue;
var base=rand(3,isMuzzle?7:15);
ctx.fillStyle='rgba('+Math.floor(rand(20,45))+','+Math.floor(rand(12,28))+','+Math.floor(rand(6,18))+',0.92)';
var blobs=Math.floor(rand(3,6));
ctx.beginPath();
for(var b=0;b<blobs;b++){
var bx=sx+rand(-base*0.6,base*0.6),by=sy+rand(-base*0.6,base*0.6),br=base*rand(0.6,1.05);
ctx.moveTo(bx+br,by);
ctx.arc(bx,by,br,0,Math.PI*2);
}
ctx.fill();
}
var tex=new THREE.CanvasTexture(c);
tex.needsUpdate=true;
return tex;
}

function makeBumpTexture(){
var c=document.createElement('canvas');
c.width=512;c.height=512;
var ctx=c.getContext('2d');
ctx.fillStyle='#808080';ctx.fillRect(0,0,512,512);
for(var n=0;n<6000;n++){
var v=Math.floor(rand(90,170));
ctx.fillStyle='rgb('+v+','+v+','+v+')';
ctx.fillRect(rand(0,512),rand(0,512),1.2,1.2);
}
var tex=new THREE.CanvasTexture(c);
tex.needsUpdate=true;
return tex;
}

function makeIrisTexture(){
var c=document.createElement('canvas');
c.width=256;c.height=256;
var ctx=c.getContext('2d');
var g=ctx.createRadialGradient(128,128,10,128,128,124);
g.addColorStop(0,'#3a2408');
g.addColorStop(0.35,'#8a5a1a');
g.addColorStop(0.7,'#c98f2e');
g.addColorStop(1,'#5c3c14');
ctx.fillStyle=g;ctx.fillRect(0,0,256,256);
ctx.strokeStyle='rgba(40,24,8,0.35)';
ctx.lineWidth=2;
for(var i=0;i<40;i++){
var a=(i/40)*Math.PI*2;
ctx.beginPath();
ctx.moveTo(128+Math.cos(a)*30,128+Math.sin(a)*30);
ctx.lineTo(128+Math.cos(a)*122,128+Math.sin(a)*122);
ctx.stroke();
}
var tex=new THREE.CanvasTexture(c);
tex.needsUpdate=true;
return tex;
}

var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(30,width/height,0.1,100);
camera.position.set(0,0.1,7.5);

var renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(width,height,false);

var key=new THREE.DirectionalLight(0xfff4e0,1.15);
key.position.set(3.5,4,5);
scene.add(key);
var fill=new THREE.DirectionalLight(0xd7e8ff,0.4);
fill.position.set(-4,-1,3);
scene.add(fill);
var rim=new THREE.DirectionalLight(0xffe9c2,0.6);
rim.position.set(-2,3,-5);
scene.add(rim);
scene.add(new THREE.AmbientLight(0x3a2f22,0.65));

var headGroup=new THREE.Group();
scene.add(headGroup);

var coatBump=makeBumpTexture();
var coatTex=makeCoatTexture(false);
var muzzleTex=makeCoatTexture(true);

var coatMat=new THREE.MeshPhysicalMaterial({map:coatTex,bumpMap:coatBump,bumpScale:0.012,roughness:0.62,clearcoat:0.06,clearcoatRoughness:0.7});
var muzzleMat=new THREE.MeshPhysicalMaterial({map:muzzleTex,bumpMap:coatBump,bumpScale:0.01,roughness:0.65});
var darkMat=new THREE.MeshPhysicalMaterial({color:0x1c130d,roughness:0.35,clearcoat:0.5,clearcoatRoughness:0.3});
var noseMat=new THREE.MeshPhysicalMaterial({color:0x120c08,roughness:0.25,clearcoat:0.8,clearcoatRoughness:0.2});
var scleraMat=new THREE.MeshPhysicalMaterial({color:0xF2ECDF,roughness:0.2,clearcoat:0.7,clearcoatRoughness:0.15});
var irisMat=new THREE.MeshBasicMaterial({map:makeIrisTexture()});
var whiskerMat=new THREE.MeshStandardMaterial({color:0xF5F0E6,roughness:0.5});

var head=new THREE.Mesh(new THREE.SphereGeometry(1.55,64,64),coatMat);
head.scale.set(1,0.9,0.88);
headGroup.add(head);

var cheekL=new THREE.Mesh(new THREE.SphereGeometry(0.62,32,32),coatMat);
cheekL.position.set(-1.0,-0.35,0.75);
cheekL.scale.set(1,0.85,0.85);
headGroup.add(cheekL);
var cheekR=cheekL.clone();
cheekR.position.x=1.0;
headGroup.add(cheekR);

var muzzle=new THREE.Mesh(new THREE.SphereGeometry(0.72,32,32),muzzleMat);
muzzle.scale.set(1.15,0.72,0.95);
muzzle.position.set(0,-0.62,1.28);
headGroup.add(muzzle);

var browL=new THREE.Mesh(new THREE.SphereGeometry(0.3,20,20),coatMat);
browL.scale.set(1.3,0.5,0.6);
browL.position.set(-0.55,0.62,1.15);
headGroup.add(browL);
var browR=browL.clone();
browR.position.x=0.55;
headGroup.add(browR);

var nose=new THREE.Mesh(new THREE.SphereGeometry(0.24,20,20),noseMat);
nose.scale.set(1.35,0.8,0.75);
nose.position.set(0,-0.5,2.0);
headGroup.add(nose);

[[-1,1],[1,1]].forEach(function(s){
var earBack=new THREE.Mesh(new THREE.SphereGeometry(0.45,24,24,0,Math.PI*2,0,Math.PI*0.6),darkMat);
earBack.position.set(s[0]*1.2,1.3,-0.15);
earBack.rotation.x=Math.PI;
earBack.rotation.z=s[0]*0.4;
headGroup.add(earBack);
var earFront=new THREE.Mesh(new THREE.SphereGeometry(0.34,20,20,0,Math.PI*2,0,Math.PI*0.55),coatMat);
earFront.position.set(s[0]*1.2,1.24,0.02);
earFront.rotation.z=s[0]*0.4;
headGroup.add(earFront);
});

for(var t=0;t<2;t++){
var side=t===0?-1:1;
var stripe=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.09,1.25,12),darkMat);
stripe.position.set(side*0.48,-0.28,1.42);
stripe.rotation.z=side*0.22;
stripe.rotation.x=0.35;
headGroup.add(stripe);
}

[[-1,-0.7],[1,-0.7]].forEach(function(s){
for(var w=0;w<3;w++){
var whisker=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.004,1.1,6),whiskerMat);
whisker.position.set(s[0]*0.52,-0.48-w*0.06,1.92);
whisker.rotation.z=s[0]*(1.52-w*0.08);
whisker.rotation.y=s[0]*0.05;
headGroup.add(whisker);
}
});

var eyePivots=[],irisMeshes=[];
[-0.56,0.56].forEach(function(sx){
var socket=new THREE.Mesh(new THREE.SphereGeometry(0.26,24,24),scleraMat);
socket.position.set(sx,0.3,1.32);
headGroup.add(socket);
var pivot=new THREE.Group();
pivot.position.copy(socket.position);
headGroup.add(pivot);
var iris=new THREE.Mesh(new THREE.CircleGeometry(0.15,24),irisMat);
iris.position.set(0,0,0.245);
pivot.add(iris);
var pupil=new THREE.Mesh(new THREE.CircleGeometry(0.065,20),darkMat);
pupil.position.set(0,0,0.248);
pivot.add(pupil);
var glint=new THREE.Mesh(new THREE.CircleGeometry(0.022,10),new THREE.MeshBasicMaterial({color:0xffffff}));
glint.position.set(0.05,0.055,0.25);
pivot.add(glint);
eyePivots.push(pivot);
});

var groundTexC=document.createElement('canvas');
groundTexC.width=256;groundTexC.height=256;
var gctx=groundTexC.getContext('2d');
var gg=gctx.createRadialGradient(128,128,10,128,128,128);
gg.addColorStop(0,'rgba(0,0,0,0.32)');
gg.addColorStop(1,'rgba(0,0,0,0)');
gctx.fillStyle=gg;gctx.fillRect(0,0,256,256);
var ground=new THREE.Mesh(new THREE.PlaneGeometry(3.6,3.6),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(groundTexC),transparent:true}));
ground.position.set(0,-1.9,0.4);
ground.rotation.x=-Math.PI/2.3;
scene.add(ground);

var plane=new THREE.Plane(new THREE.Vector3(0,0,1),-2.2);
var raycaster=new THREE.Raycaster();
var mouseNDC=new THREE.Vector2(0,0);
var targetPoint=new THREE.Vector3(0,0,2.2);
var desiredYaw=0,desiredPitch=0;

function onMove(clientX,clientY){
var rect=canvas.getBoundingClientRect();
mouseNDC.x=((clientX-rect.left)/rect.width)*2-1;
mouseNDC.y=-(((clientY-rect.top)/rect.height)*2-1);
raycaster.setFromCamera(mouseNDC,camera);
var hit=new THREE.Vector3();
raycaster.ray.intersectPlane(plane,hit);
if(hit){
targetPoint.copy(hit);
desiredYaw=Math.max(-0.45,Math.min(0.45,mouseNDC.x*0.45));
desiredPitch=Math.max(-0.22,Math.min(0.22,mouseNDC.y*0.26));
}
}
document.addEventListener('mousemove',function(ev){onMove(ev.clientX,ev.clientY);});
document.addEventListener('touchmove',function(ev){if(ev.touches[0])onMove(ev.touches[0].clientX,ev.touches[0].clientY);},{passive:true});

function animate(){
requestAnimationFrame(animate);
headGroup.rotation.y+=(desiredYaw-headGroup.rotation.y)*0.08;
headGroup.rotation.x+=(-desiredPitch-headGroup.rotation.x)*0.08;
eyePivots.forEach(function(p){
var localTarget=headGroup.worldToLocal(targetPoint.clone());
p.lookAt(localTarget);
});
renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',function(){
var w=wrap.clientWidth>560?560:wrap.clientWidth;
renderer.setSize(w,height,false);
camera.aspect=w/height;
camera.updateProjectionMatrix();
});
})();
</script>

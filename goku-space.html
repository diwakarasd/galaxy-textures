<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Stone Genesis — Super Saiyan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #050403;
    --amber: #ffb454;
    --amber-dim: #7a4a12;
    --ember: #ffdfb0;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--void);
    overflow: hidden;
    cursor: none;
  }
  #canvas-wrap{
    position: fixed; inset:0; width:100%; height:100%;
    opacity: 0;
    transition: opacity 2.2s ease;
  }
  #canvas-wrap.ready{ opacity: 1; }
  canvas{ display:block; width:100%; height:100%; }

  #vignette{
    position: fixed; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.92) 100%);
    z-index: 5;
  }
  #grain{
    position: fixed; inset:0; pointer-events:none; z-index:6;
    opacity: 0.035; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  #loader{
    position: fixed; inset:0; z-index: 20;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    background: var(--void);
    transition: opacity 1.1s ease;
  }
  #loader.hide{ opacity:0; pointer-events:none; }
  #loader .mark{
    font-family:'Cinzel', serif; font-weight:600; letter-spacing:0.35em;
    font-size:13px; color: var(--amber); text-transform:uppercase;
    opacity:0.85; animation: pulse 2.4s ease-in-out infinite;
  }
  #loader .ring{
    width:46px; height:46px; margin-bottom:22px;
    border-radius:50%;
    border: 1px solid rgba(255,180,84,0.15);
    border-top-color: var(--amber);
    animation: spin 1.4s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  @keyframes pulse{ 0%,100%{ opacity:0.4; } 50%{ opacity:0.9; } }

  #caption{
    position: fixed; left: 32px; bottom: 30px; z-index: 8;
    opacity: 0; transform: translateY(6px);
    transition: opacity 1.8s ease 0.6s, transform 1.8s ease 0.6s;
    pointer-events: none;
  }
  #caption.show{ opacity:1; transform: translateY(0); }
  #caption .eyebrow{
    font-family:'Inter', sans-serif; font-weight:400; font-size:10.5px;
    letter-spacing:0.32em; text-transform:uppercase;
    color: rgba(255,223,176,0.55); margin-bottom:6px;
  }
  #caption .title{
    font-family:'Cinzel', serif; font-weight:600; font-size:20px;
    letter-spacing:0.06em; color: var(--amber);
    text-shadow: 0 0 18px rgba(255,180,84,0.35);
  }

  #cursor-glow{
    position: fixed; z-index: 7; pointer-events: none;
    width: 22px; height: 22px; border-radius: 50%;
    left:0; top:0;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle, rgba(255,196,120,0.55) 0%, rgba(255,180,84,0.12) 45%, rgba(255,180,84,0) 72%);
    transition: opacity 0.4s ease;
  }
</style>
</head>
<body>

  <div id="loader"><div class="ring"></div><div class="mark">Materializing</div></div>

  <div id="canvas-wrap"><canvas id="scene"></canvas></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="cursor-glow"></div>

  <div id="caption">
    <div class="eyebrow">Stone Form &middot; Super Saiyan</div>
    <div class="title">Genesis in the Void</div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------------------------------------------------------
   MODEL SOURCE — loaded from external URL
--------------------------------------------------------- */
const MODEL_URL = "https://diwakarasd.github.io/galaxy-textures/goku.glb";

/* ---------------------------------------------------------
   CORE SETUP
--------------------------------------------------------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050403);
scene.fog = new THREE.FogExp2(0x050403, 0.04);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);

const TARGET_HEIGHT = 3.4;

/* ---------------------------------------------------------
   LIGHTS — off-center key + fill, near-black void otherwise.
   The two amber rings ALSO carry real point lights so their
   glow actually falls on the stone and ground, not just a
   flat glowing decal.
--------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0x1c1712, 0x000000, 0.45);
scene.add(hemi);

const rim = new THREE.DirectionalLight(0xffdfb0, 1.6);
rim.position.set(-4.5, 5.2, 3.4);
rim.castShadow = true;
rim.shadow.mapSize.set(1024,1024);
rim.shadow.bias = -0.0015;
rim.shadow.camera.left = -5;
rim.shadow.camera.right = 5;
rim.shadow.camera.top = 5;
rim.shadow.camera.bottom = -5;
scene.add(rim);
const rimTarget = new THREE.Object3D();
rimTarget.position.set(0, TARGET_HEIGHT*0.5, 0);
scene.add(rimTarget);
rim.target = rimTarget;

const fill = new THREE.DirectionalLight(0xffb454, 0.4);
fill.position.set(3.5, 1.8, -3);
scene.add(fill);

/* ---------------------------------------------------------
   GROUND — fades to void, no hard edges
--------------------------------------------------------- */
function makeGroundTexture(){
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(size/2,size/2,0, size/2,size/2,size/2);
  grad.addColorStop(0, 'rgba(22,17,12,1)');
  grad.addColorStop(0.55, 'rgba(11,8,6,0.85)');
  grad.addColorStop(1, 'rgba(5,4,3,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const groundGeo = new THREE.CircleGeometry(9, 64);
const groundMat = new THREE.MeshStandardMaterial({
  map: makeGroundTexture(), transparent:true, roughness:1, metalness:0,
  color: 0x1a1512
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------
   SELECTIVE BLOOM SETUP
   Only objects on BLOOM_LAYER actually bloom — this keeps the
   rings looking like real emissive light sources instead of
   washing the whole frame out with a flat glow.
--------------------------------------------------------- */
const BLOOM_LAYER = 1;
const bloomLayer = new THREE.Layers();
bloomLayer.set(BLOOM_LAYER);

const darkMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
const materialCache = {};

function darkenNonBloomed(obj){
  if(obj.isMesh && bloomLayer.test(obj.layers) === false){
    materialCache[obj.uuid] = obj.material;
    obj.material = darkMaterial;
  }
}
function restoreMaterial(obj){
  if(materialCache[obj.uuid]){
    obj.material = materialCache[obj.uuid];
    delete materialCache[obj.uuid];
  }
}

/* ---------------------------------------------------------
   AMBER ORBIT RINGS — small ring above Goku, big ring below.
   Each ring is: a bright emissive core + a soft additive halo
   (both on the bloom layer) + a real PointLight that lights
   the stone and ground with warm amber.
--------------------------------------------------------- */
const rings = [];
const ringLights = [];
const ringDefs = [
  // small ring, floating above Goku's head, like a halo
  { r: 0.85, tube: 0.03, y: TARGET_HEIGHT + 0.55, tiltX: 1.48, tiltZ: 0.06, speed: 0.05, lightIntensity: 1.4, lightDistance: 4.5 },
  // big ring, resting low around his feet
  { r: 6.4, tube: 0.05, y: 0.06, tiltX: 1.53, tiltZ: -0.03, speed: -0.014, lightIntensity: 2.4, lightDistance: 10 },
];
ringDefs.forEach(def=>{
  const coreGeo = new THREE.TorusGeometry(def.r, def.tube, 20, 220);
  const coreMat = new THREE.MeshStandardMaterial({
    color: 0x3a2408,
    emissive: 0xffb454,
    emissiveIntensity: 1.8,
    roughness: 0.35,
    metalness: 0.4
  });
  const core = new THREE.Mesh(coreGeo, coreMat);
  core.position.y = def.y;
  core.rotation.x = def.tiltX;
  core.rotation.z = def.tiltZ;
  core.userData.speed = def.speed;
  core.layers.enable(BLOOM_LAYER);
  scene.add(core);
  rings.push(core);

  const haloGeo = new THREE.TorusGeometry(def.r, def.tube * 3.2, 16, 200);
  const haloMat = new THREE.MeshBasicMaterial({
    color: 0xffb454, transparent:true, opacity:0.35,
    blending: THREE.AdditiveBlending, depthWrite:false
  });
  const halo = new THREE.Mesh(haloGeo, haloMat);
  halo.position.y = def.y;
  halo.rotation.x = def.tiltX;
  halo.rotation.z = def.tiltZ;
  halo.userData.speed = def.speed;
  halo.layers.enable(BLOOM_LAYER);
  scene.add(halo);
  rings.push(halo);

  const light = new THREE.PointLight(0xffb454, def.lightIntensity, def.lightDistance, 2);
  light.position.set(0, def.y, 0);
  scene.add(light);
  ringLights.push(light);
});

/* ---------------------------------------------------------
   Shared helper: build a spiral/belt particle field driven by
   an InstancedMesh, with cursor-repulsion physics.
--------------------------------------------------------- */
const GOLDEN_ANGLE = 2.399963229728653;

function buildField(count, radiusFn, heightFn, speedFn, scaleFn){
  const data = [];
  for(let i=0;i<count;i++){
    const t = i / count;
    data.push({
      radius: radiusFn(i,t),
      angle0: i * GOLDEN_ANGLE,
      height: heightFn(i,t),
      orbitSpeed: speedFn(i,t)*2,
      bobFreq: 0.35 + Math.random()*0.6,
      bobPhase: Math.random()*Math.PI*2,
      bobAmp: 0.06 + Math.random()*0.05,
      tumbleAxis: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize(),
      tumbleSpeed: 0.2 + Math.random()*0.8,
      rotation: new THREE.Quaternion(),
      scale: scaleFn(i,t),
      offset: new THREE.Vector3(),
      idealPos: new THREE.Vector3(),
    });
  }
  return data;
}

/* ---------------------------------------------------------
   FINE DUST SPIRAL — tiny tumbling debris
--------------------------------------------------------- */
const DEBRIS_COUNT = 130;
const debrisGeo = new THREE.IcosahedronGeometry(0.045, 0);
const debrisMat = new THREE.MeshStandardMaterial({
  color: 0x2b2621, roughness: 0.92, metalness: 0.08,
  emissive: 0x2a1608, emissiveIntensity: 0.5
});
const debrisMesh = new THREE.InstancedMesh(debrisGeo, debrisMat, DEBRIS_COUNT);
debrisMesh.castShadow = true;
debrisMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(debrisMesh);

const debrisData = buildField(
  DEBRIS_COUNT,
  (i,t)=> 2.6 + t * 5.6,
  (i,t)=> -0.2 + t * 6.2 + Math.sin(i*12.9)*0.15,
  (i,t)=> (0.16 / ((2.6 + t*5.6)*0.35)) * (i % 2 === 0 ? 1 : -0.85),
  (i,t)=> 0.55 + Math.random()*1.1
);

/* ---------------------------------------------------------
   ASTEROIDS — larger, irregular rocks revolving in a belt
   around Goku. These respond to cursor movement too.
--------------------------------------------------------- */
function makeAsteroidGeometry(seed){
  const geo = new THREE.IcosahedronGeometry(1, 1);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos, i);
    const n = 0.22*Math.sin(v.x*3.1+seed) + 0.18*Math.cos(v.y*4.4+seed*1.7) + 0.15*Math.sin(v.z*5.3+seed*2.3);
    v.addScaledVector(v.clone().normalize(), n);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

const ASTEROID_COUNT = 24;
const asteroidGeo = makeAsteroidGeometry(4.2);
const asteroidMat = new THREE.MeshStandardMaterial({
  color: 0x2f2a24, roughness: 0.95, metalness: 0.05,
  emissive: 0x3a2008, emissiveIntensity: 0.6
});
const asteroidMesh = new THREE.InstancedMesh(asteroidGeo, asteroidMat, ASTEROID_COUNT);
asteroidMesh.castShadow = true;
asteroidMesh.receiveShadow = true;
asteroidMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(asteroidMesh);

const asteroidData = buildField(
  ASTEROID_COUNT,
  (i,t)=> 3.3 + Math.sin(i*7.1)*0.7 + t*1.1,
  (i,t)=> -0.1 + Math.sin(i*3.3)*0.55 + t*0.6,
  (i,t)=> (0.09 + Math.random()*0.04) * (i % 3 === 0 ? -1 : 1),
  (i,t)=> 0.16 + Math.random()*0.22
);

/* ---------------------------------------------------------
   POINTER TRACKING
--------------------------------------------------------- */
const dummy = new THREE.Object3D();
const mouseNDC = new THREE.Vector2(0,0);
const mouseTarget = new THREE.Vector2(0,0);
let pointerActive = false;

function updatePointer(clientX, clientY){
  mouseTarget.x = (clientX / window.innerWidth) * 2 - 1;
  mouseTarget.y = -(clientY / window.innerHeight) * 2 + 1;
  pointerActive = true;
  const glow = document.getElementById('cursor-glow');
  glow.style.left = clientX + 'px';
  glow.style.top = clientY + 'px';
}
window.addEventListener('pointermove', (e)=> updatePointer(e.clientX, e.clientY));
window.addEventListener('pointerdown', (e)=> updatePointer(e.clientX, e.clientY));
window.addEventListener('pointerleave', ()=>{ pointerActive = false; });

/* ---------------------------------------------------------
   CAMERA RIG — perpetual circling, inverse cursor-height
--------------------------------------------------------- */
const CAM_RADIUS = 7.6;
const CAM_BASE_HEIGHT = TARGET_HEIGHT*0.56;
const CAM_HEIGHT_AMPLITUDE = 1.05;
let camAzimuth = 0;
let camHeightCurrent = CAM_BASE_HEIGHT;

/* ---------------------------------------------------------
   POSTPROCESSING — selective bloom (rings only), composited
   back over the normally lit base scene.
--------------------------------------------------------- */
const renderPass = new RenderPass(scene, camera);

const bloomComposer = new EffectComposer(renderer);
bloomComposer.renderToScreen = false;
bloomComposer.addPass(renderPass);
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),  0.65,0.30,0.15
);
bloomComposer.addPass(bloomPass);

const mixPass = new ShaderPass(
  new THREE.ShaderMaterial({
    uniforms: {
      baseTexture: { value: null },
      bloomTexture: { value: bloomComposer.renderTarget2.texture }
    },
    vertexShader: `
      varying vec2 vUv;
      void main(){
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D baseTexture;
      uniform sampler2D bloomTexture;
      varying vec2 vUv;
      void main(){
        vec4 base = texture2D(baseTexture, vUv);
        vec4 bloom = texture2D(bloomTexture, vUv);
        gl_FragColor = base + bloom;
      }
    `
  }), 'baseTexture'
);
mixPass.needsSwap = true;

const finalComposer = new EffectComposer(renderer);
finalComposer.addPass(renderPass);
finalComposer.addPass(mixPass);
finalComposer.addPass(new OutputPass());

/* ---------------------------------------------------------
   LOAD MODEL
--------------------------------------------------------- */
const loader = new GLTFLoader();
let modelReady = false;

loader.load(MODEL_URL, (gltf)=>{
  const model = gltf.scene;

  model.traverse(node=>{
    if(node.isMesh){
      node.castShadow = true;
      node.receiveShadow = true;
      if(node.material){
        node.material.envMapIntensity = 1.0;
      }
    }
  });

  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3();
  box.getSize(size);
  const scaleFactor = TARGET_HEIGHT / Math.max(size.y, 0.0001);
  model.scale.setScalar(scaleFactor);

  const box2 = new THREE.Box3().setFromObject(model);
  const center2 = new THREE.Vector3();
  box2.getCenter(center2);
  model.position.x -= center2.x;
  model.position.z -= center2.z;
  model.position.y -= box2.min.y;

  scene.add(model);
  modelReady = true;

  document.getElementById('loader').classList.add('hide');
  document.getElementById('canvas-wrap').classList.add('ready');
  document.getElementById('caption').classList.add('show');
}, undefined, (err)=>{
  console.error('GLTF load error:', err);
  document.querySelector('#loader .mark').textContent = 'Failed to load model';
});

/* ---------------------------------------------------------
   ANIMATE
--------------------------------------------------------- */
const clock = new THREE.Clock();
const tmpVec = new THREE.Vector3();
const camRight = new THREE.Vector3();
const camUp = new THREE.Vector3();
const pushDir = new THREE.Vector2();
const worldPush = new THREE.Vector3();

function updateField(mesh, data, count, t, aspect, repelRadius, pushMag, geomScale){
  for(let i=0;i<count;i++){
    const d = data[i];
    const angle = d.angle0 + t * d.orbitSpeed;
    d.idealPos.set(
      Math.cos(angle) * d.radius,
      d.height + Math.sin(t*d.bobFreq + d.bobPhase) * d.bobAmp,
      Math.sin(angle) * d.radius
    );

    tmpVec.copy(d.idealPos).project(camera);
    pushDir.set((tmpVec.x - mouseNDC.x) * aspect, tmpVec.y - mouseNDC.y);
    const dist = pushDir.length();

    worldPush.set(0,0,0);
    if(pointerActive && dist < repelRadius && dist > 0.0001){
      const strength = (1 - dist/repelRadius);
      pushDir.normalize();
      worldPush.addScaledVector(camRight, pushDir.x * pushMag * strength);
      worldPush.addScaledVector(camUp, pushDir.y * pushMag * strength);
    }

    const lerpFactor = worldPush.lengthSq() > d.offset.lengthSq() ? 0.28 : 0.045;
    d.offset.lerp(worldPush, lerpFactor);

    dummy.position.copy(d.idealPos).add(d.offset);
    d.rotation.setFromAxisAngle(d.tumbleAxis, t * d.tumbleSpeed);
    dummy.quaternion.copy(d.rotation);
    dummy.scale.setScalar(d.scale * geomScale);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  mouseNDC.x += (mouseTarget.x - mouseNDC.x) * 0.12;
  mouseNDC.y += (mouseTarget.y - mouseNDC.y) * 0.12;

  camAzimuth += dt * 0.062;
  const desiredHeight = CAM_BASE_HEIGHT - mouseNDC.y * CAM_HEIGHT_AMPLITUDE * (pointerActive ? 1 : 0);
  camHeightCurrent += (desiredHeight - camHeightCurrent) * 0.035;

  camera.position.x = Math.sin(camAzimuth) * CAM_RADIUS;
  camera.position.z = Math.cos(camAzimuth) * CAM_RADIUS;
  camera.position.y = camHeightCurrent;
  camera.lookAt(0, TARGET_HEIGHT*0.52, 0);

  camera.updateMatrixWorld();
  camRight.setFromMatrixColumn(camera.matrixWorld, 0);
  camUp.setFromMatrixColumn(camera.matrixWorld, 1);

  rings.forEach(r=>{ r.rotation.z += dt * r.userData.speed; });

  const aspect = window.innerWidth / window.innerHeight;

  updateField(debrisMesh, debrisData, DEBRIS_COUNT, t, aspect, 0.15, 1.2, 0.045);
  updateField(asteroidMesh, asteroidData, ASTEROID_COUNT, t, aspect, 0.20, 1.9, 1.0);

  scene.traverse(darkenNonBloomed);
  bloomComposer.render();
  scene.traverse(restoreMaterial);

  finalComposer.render();
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  bloomComposer.setSize(window.innerWidth, window.innerHeight);
  finalComposer.setSize(window.innerWidth, window.innerHeight);
  bloomPass.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
